trigger:
  - main

pr:
  - main

schedules:
  - cron: "0 9 * * Sat"
    displayName: "Build for Component Governance"
    branches:
      include:
        - main
    always: true

variables:
  - name: QSHARP_PYTHON_TELEMETRY
    value: none # Disable usage telemetry for internal test pipelines
  - name: PYTEST_MAX_PARALLEL_TESTS
    value: "auto"
  # Azure Artifacts feed (with a PyPI upstream source) that pip restores from, so the
  # build does not connect directly to public pypi.org / files.pythonhosted.org (CFS).
  # Project-scoped: "<Project>/<FeedName>".
  - name: PipFeed
    value: "AzureQuantum/azure-quantum"
  # Stop pip from contacting pypi.org for its "is there a newer pip?" self-check.
  - name: PIP_DISABLE_PIP_VERSION_CHECK
    value: "1"

jobs:
  - job: "Build_Azure_Quantum_Python"
    displayName: Build "azure-quantum" package
    pool:
      vmImage: "windows-latest"

    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.11"
        displayName: Set Python version

      - task: PipAuthenticate@1
        displayName: Authenticate pip to Azure Artifacts feed
        inputs:
          artifactFeeds: $(PipFeed)
          onlyAddExtraIndex: false

      - script: |
          pip install wheel
        displayName: Install wheel

      - script: |
          pip freeze
        displayName: List installed packages

      - script: |
          cd $(Build.SourcesDirectory)/azure-quantum
          python setup.py sdist --dist-dir=target/wheels
          python setup.py bdist_wheel --dist-dir=target/wheels
        displayName: Build azure-quantum package

      - publish: $(Build.SourcesDirectory)/azure-quantum/target/wheels/
        artifact: azure-quantum-wheels
        displayName: Upload azure-quantum artifacts

  - job: "Test_Azure_Quantum_Python"
    displayName: Test "azure-quantum" package
    pool:
      vmImage: "windows-latest"

    steps:
      - task: UsePythonVersion@0
        inputs:
          versionSpec: "3.11"
        displayName: Set Python version

      - task: PipAuthenticate@1
        displayName: Authenticate pip to Azure Artifacts feed
        inputs:
          artifactFeeds: $(PipFeed)
          onlyAddExtraIndex: false

      - script: |
          python -m pip install --upgrade pip
          pip install pytest pytest-azurepipelines pytest-cov pytest-xdist tox
        displayName: Install test dependencies

      - script: |
          pip freeze
        displayName: List installed packages

      - script: |
          cd $(Build.SourcesDirectory)/azure-quantum
          pip install ".[cirq,qsharp,dev]"
          pytest --numprocesses $(PYTEST_MAX_PARALLEL_TESTS) --cov=azure.quantum --cov-append --junitxml test-output-azure-quantum.xml tests
        displayName: Run azure-quantum tests

      - script: |
          cd $(Build.SourcesDirectory)/azure-quantum
          tox -e py311-qiskit1,py311-qiskit2
        displayName: Run Qiskit matrix tests

      - task: PublishTestResults@2
        displayName: "Publish tests results (python)"
        condition: succeededOrFailed()
        inputs:
          testResultsFormat: "JUnit"
          testResultsFiles: "**/test-*.xml"
          testRunTitle: "Azure Quantum Python Tests"

      - task: ms.vss-governance-buildtask.governance-build-task-component-detection.ComponentGovernanceComponentDetection@0
        displayName: "Component detection"
